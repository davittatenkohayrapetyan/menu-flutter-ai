name: menu_flutter_ai
description: Flutter app to snap or pick menu photos and parse dishes via OpenAI API
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Routing
  go_router: ^13.0.0
  
  # JSON serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # HTTP client
  dio: ^5.4.0
  
  # Camera and image
  camera: ^0.10.5+5
  image_picker: ^1.0.5
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code generation
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
